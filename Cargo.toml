[package]
name = "brass_control"
version = "0.1.0"
edition = "2024"

[dependencies]
globset = "0.4"
flate2 = "1.0"
sha2 = "0.10"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
